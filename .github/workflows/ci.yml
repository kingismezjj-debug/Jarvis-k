name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Dependency Boundaries
        run: npm run check:boundaries

      - name: Sensitive Artifact Guard
        run: npm run check:sensitive-artifacts

      - name: Build
        run: npm run build

      - name: Fixture Inference Desktop Smoke
        run: npm run smoke:desktop:fixture-inference:built
